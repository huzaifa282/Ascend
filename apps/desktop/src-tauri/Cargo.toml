[package]
name = "ascendant"
version = "0.1.0"
description = "Ascendant: an open-source, local-first life RPG and daily companion."
edition = "2021"
rust-version = "1.77"

[lib]
name = "ascendant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-window-state = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Single mutex-guarded connection, not a pool — see docs/decisions.md
# ("Custom rusqlite command layer instead of tauri-plugin-sql").
rusqlite = { version = "0.32", features = ["bundled"] }
include_dir = "0.7"
# Spec 12.1: API keys only in the OS keychain, never in SQLite/files/logs.
# keyring 3.x ships no default backend — without an explicit feature it silently
# falls back to a non-persistent mock store, so keys would never read back after
# being set. Windows-only for now, matching this build's desktop/Windows scope.
keyring = { version = "3", features = ["windows-native"] }
# Spec 11.1: music folder tag/cover-art scanning.
lofty = "0.21"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
# Optimized for a small, fast-starting desktop binary (plan decision #2).
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
