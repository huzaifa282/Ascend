[package]
name = "ascendant"
version = "0.1.0"
description = "Ascendant: an open-source, local-first life RPG and daily companion."
edition = "2021"
rust-version = "1.77"

[lib]
name = "ascendant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Optimized for a small, fast-starting desktop binary (plan decision #2).
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
